<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>공간 스캐너 — 실측 도면 · 배치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c141d; --surface:#131f2b; --surface2:#0f1a24; --line:#233241;
    --ink:#e9eff5; --muted:#8298ab;
    --measure:#35d6c0; --measure-ink:#04211d;
    --calib:#f4b13c; --calib-ink:#2a1c02;
    --danger:#f27a7a;
    --disp:'Space Grotesk',-apple-system,sans-serif;
    --body:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;}
  h1,h2,.disp{font-family:var(--disp);letter-spacing:-.4px;}
  .btn{font:inherit;font-weight:600;font-size:15px;padding:13px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.38;}
  .btn.measure{background:var(--measure);border-color:var(--measure);color:var(--measure-ink);}
  .btn.calib{background:var(--calib);border-color:var(--calib);color:var(--calib-ink);}
  .btn.ghost{background:transparent;}
  .row{display:flex;gap:8px;}
  .row .btn{flex:1;padding:12px 8px;font-size:14px;}

  /* chips + primary bar */
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .chip{font:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(15,23,32,.72);color:var(--muted);white-space:nowrap;}
  .chip:active{transform:translateY(1px);}
  .chip.on{color:var(--measure);border-color:rgba(53,214,192,.55);background:rgba(53,214,192,.12);}
  .chip.whl{display:flex;align-items:center;gap:5px;}
  .chip.whl input{width:46px;background:transparent;border:none;color:var(--ink);font:inherit;font-size:14px;text-align:center;padding:0;}
  .primary{display:flex;align-items:stretch;gap:10px;}
  .pbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;font-weight:700;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 8px;}
  .pbtn:active{transform:translateY(1px);}
  .pbtn:disabled{opacity:.4;}
  .pbtn .big{font-size:22px;line-height:1;}
  .pbtn small{font-size:11px;font-weight:600;color:var(--muted);}
  .pbtn.add{flex:1.7;background:var(--measure);border-color:var(--measure);color:var(--measure-ink);}
  .pbtn.add .big{font-size:26px;}
  .pbtn.add small{color:rgba(4,33,29,.72);}

  /* intro */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:28px;
    background:radial-gradient(90% 60% at 50% -10%,#16283a 0%,transparent 60%),linear-gradient(180deg,#0c141d,#0a1119);z-index:30;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:26px;font-weight:700;margin:0;}
  .brand .v{font-family:var(--disp);font-size:13px;color:var(--measure);border:1px solid var(--line);border-radius:20px;padding:2px 9px;}
  #intro p.lede{margin:0;color:var(--muted);font-size:14px;line-height:1.65;max-width:360px;}
  .modes{display:flex;flex-direction:column;gap:12px;}
  .mode{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);width:100%;}
  .mode:disabled{opacity:.45;}
  .mode .tick{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:19px;}
  .mode.ar .tick{background:rgba(53,214,192,.14);color:var(--measure);}
  .mode.photo .tick{background:rgba(244,177,60,.14);color:var(--calib);}
  .mode.place .tick{background:rgba(147,180,255,.16);color:#9ec5ff;}
  .mode .t{font-family:var(--disp);font-weight:600;font-size:16px;margin-bottom:3px;}
  .mode .d{font-size:12.5px;color:var(--muted);line-height:1.5;}
  #capNote{font-size:12.5px;color:var(--muted);line-height:1.55;}
  #capNote b{color:var(--ink);}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:20;}
  #topbar{position:fixed;top:0;left:0;right:0;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;display:none;justify-content:space-between;align-items:center;z-index:25;background:linear-gradient(180deg,rgba(8,13,19,.85),transparent);}
  .seg{display:flex;background:rgba(9,15,21,.8);border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border:0;background:transparent;color:var(--muted);}
  .seg button.on{background:var(--measure);color:var(--measure-ink);}

  #hud,#photoUI{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:9px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));z-index:22;background:linear-gradient(180deg,transparent,rgba(7,11,16,.82) 30%);}
  .status{align-self:center;text-align:center;max-width:94vw;font-size:13px;font-weight:600;background:rgba(9,15,21,.82);border:1px solid var(--line);padding:7px 14px;border-radius:999px;}
  .palette{display:flex;gap:7px;overflow-x:auto;padding:2px 0;}
  .palette .chip{flex:0 0 auto;}
  .hbox{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);}
  .hbox input,select{font:inherit;font-size:14px;padding:8px;border-radius:9px;border:1px solid var(--line);background:#0d1720;color:var(--ink);}
  .hbox input{width:66px;text-align:center;}

  #photoCanvas{flex:1;width:100%;touch-action:none;background:#0a1119;display:block;}
  #photoStage{position:fixed;inset:0;display:flex;flex-direction:column;}
  .stepdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin:0 3px;}
  .stepdot.on{background:var(--measure);}
  .stepdot.calib.on{background:var(--calib);}

  /* view overlays over AR */
  .viewover{position:fixed;inset:0;display:none;z-index:21;background:#0b1119;}
  #view2d svg{width:100%;height:100%;}
  #view3d canvas{display:block;width:100%;height:100%;}

  #sheet{position:fixed;inset:0;background:rgba(7,11,16,.96);z-index:40;display:none;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;}
  #sheet h2{font-size:19px;margin:6px 0 12px;}
  #plan{width:100%;background:#0d1720;border:1px solid var(--line);border-radius:14px;}
  #summary{margin:12px 0;font-size:13px;color:var(--muted);line-height:1.7;}
  #summary b{color:var(--ink);}
  #placeRow{display:none;margin-top:4px;}
  .filepick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
</style>
</head>
<body>

<!-- ===== 인트로 ===== -->
<div id="intro">
  <div class="brand"><h1>공간 스캐너</h1><span class="v">웹 · 무료</span></div>
  <p class="lede">방을 실제 크기(1:1)로 재서 3D·2D 도면을 만들고, 완성된 맵 위에 가구를 배치해봐.</p>
  <div class="modes">
    <button id="modeAR" class="mode ar" disabled><span class="tick">◎</span><span><span class="t">실시간 AR 스캔</span><span class="d">폰을 움직여 벽·바닥을 실측. 안드로이드(갤럭시) 크롬 전용.</span></span></button>
    <button id="modePhoto" class="mode photo"><span class="tick">▦</span><span><span class="t">사진 실측 도면</span><span class="d">사진 + 기준물(A4)로 미터 단위 도면. 아이폰 포함 모든 기기.</span></span></button>
    <button id="modePlace" class="mode place" disabled><span class="tick">🛋</span><span><span class="t">가구 배치 (AR)</span><span class="d">실제 공간에 가구를 놓아보기. 안드로이드 크롬 전용.</span></span></button>
  </div>
  <div id="capNote">기기 확인 중…</div>
</div>

<!-- ===== 상단바 ===== -->
<div id="topbar">
  <div class="seg" id="viewSeg">
    <button data-v="fp" class="on">1인칭</button>
    <button data-v="2d">2D</button>
    <button data-v="3d">3D</button>
  </div>
  <button id="exitBtn" class="btn ghost" style="padding:8px 12px;">✕ 종료</button>
</div>

<!-- ===== AR 화면 ===== -->
<div id="arScreen" class="screen">
  <!-- 외곽선 단계 HUD -->
  <div id="hud">
    <div class="status" id="arStatus">바닥을 천천히 비춰줘…</div>
    <div id="outlineTools">
      <div class="chips" style="margin-bottom:9px">
        <button id="arPlane" class="chip on">평면 표시</button>
        <button id="arAutoFloor" class="chip">바닥 자동</button>
        <button id="arClear" class="chip">지우기</button>
        <label class="chip whl">벽 <input id="arWallH" type="number" value="2.4" min="1" max="6" step="0.05" inputmode="decimal"> m</label>
      </div>
      <div class="primary">
        <button id="arUndo" class="pbtn side"><span class="big">↶</span><small>되돌리기</small></button>
        <button id="arAdd" class="pbtn add"><span class="big">＋</span><small>코너 추가</small></button>
        <button id="arBuild" class="pbtn side"><span class="big">✓</span><small>맵 생성 완료</small></button>
      </div>
    </div>
    <!-- 배치 단계 HUD -->
    <div id="placeTools" style="display:none">
      <div class="palette" id="palette"></div>
      <div class="chips" style="margin:8px 0">
        <button id="objRotate" class="chip">회전 45°</button>
        <label class="chip whl" id="objHrow">높이 <input id="objH" type="number" value="0.5" min="0.05" max="3" step="0.05" inputmode="decimal"> m</label>
        <button id="objClear" class="chip">가구 비우기</button>
      </div>
      <div class="primary">
        <button id="objUndo" class="pbtn side"><span class="big">↶</span><small>되돌리기</small></button>
        <button id="objAdd" class="pbtn add"><span class="big">＋</span><small>놓기</small></button>
        <button id="objDone" class="pbtn side"><span class="big">✓</span><small>도면 보기</small></button>
      </div>
    </div>
  </div>
</div>

<!-- 2D / 3D 뷰 오버레이 -->
<div id="view2d" class="viewover"><svg viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg></div>
<div id="view3d" class="viewover"></div>

<!-- ===== 사진 화면 ===== -->
<div id="photoScreen" class="screen">
  <div id="photoStage"><canvas id="photoCanvas"></canvas></div>
  <div id="photoUI">
    <div class="status" id="phStatus">사진을 먼저 불러와줘.</div>
    <div class="hbox" id="calibRow">
      <span>기준물</span>
      <select id="refPreset">
        <option value="0.210,0.297">A4 (21×29.7cm)</option>
        <option value="0.297,0.420">A3 (29.7×42cm)</option>
        <option value="custom">직접 입력(cm)</option>
      </select>
      <input id="refW" type="number" placeholder="가로" inputmode="decimal" style="display:none;">
      <input id="refH" type="number" placeholder="세로" inputmode="decimal" style="display:none;">
    </div>
    <div class="hbox">
      <span><span class="stepdot calib on" id="dot1"></span><span class="stepdot" id="dot2"></span></span>
      <span id="stepText">1. 기준물 보정</span><span>·</span><span>벽 높이(m)</span>
      <input id="phWallH" type="number" value="2.4" min="1" max="6" step="0.05" inputmode="decimal">
    </div>
    <div class="row">
      <button id="phShot" class="btn calib">사진 불러오기</button>
      <button id="phUndo" class="btn">되돌리기</button>
      <button id="phReset" class="btn ghost">처음부터</button>
    </div>
    <div class="row"><button id="phBuild" class="btn measure" disabled>도면 만들기</button></div>
  </div>
</div>
<input id="filePick" class="filepick" type="file" accept="image/*" capture="environment">

<!-- ===== 결과 시트 ===== -->
<div id="sheet">
  <h2>2D 실측 도면</h2>
  <svg id="plan" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="summary"></div>
  <div class="row">
    <button id="dlSvg" class="btn">도면 SVG</button>
    <button id="dlGlb" class="btn">3D GLB</button>
    <button id="dlJson" class="btn">좌표 JSON</button>
  </div>
  <div class="row" id="placeRow"><button id="goPlace" class="btn measure">🛋 오브젝트 배치하기</button></div>
  <div class="row"><button id="closeSheet" class="btn ghost">닫기</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id);

/* ===== 가구 프리셋 (미터: 폭 w × 깊이 d × 높이 h) ===== */
const PRESETS={
  침대:{w:1.5,d:2.0,h:0.5,c:0x9ec5ff}, 책상:{w:1.2,d:0.6,h:0.75,c:0xf4b13c},
  의자:{w:0.5,d:0.5,h:0.9,c:0xf4b13c}, 소파:{w:2.0,d:0.9,h:0.8,c:0x9ec5ff},
  장롱:{w:1.0,d:0.6,h:2.0,c:0xc0a0ff}, 냉장고:{w:0.7,d:0.7,h:1.8,c:0x9ec5ff},
  '커스텀 박스':{custom:true,c:0x35d6c0}
};

/* ===== 공유 유틸 (좌표 {x,y}=(월드X, 깊이Z)) ===== */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function polygonArea(pts){let s=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];s+=p.x*q.y-q.x*p.y;}return Math.abs(s)/2;}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function objCorners(o){const hw=o.w/2,hd=o.d/2,c=Math.cos(o.rot||0),s=Math.sin(o.rot||0);
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y])=>({x:o.cx+x*c-y*s,y:o.cy+x*s+y*c}));}

/* ===== 방 3D 그룹 (AR 표시 · GLB · 3D뷰 공용) ===== */
function buildRoomGroup(corners,objects,h){
  const g=new THREE.Group();
  if(corners.length>=3){
    const contour=corners.map(c=>new THREE.Vector2(c.x,c.y));
    const faces=THREE.ShapeUtils.triangulateShape(contour,[]);
    const pos=[],idx=[]; corners.forEach(c=>pos.push(c.x,0,c.y)); faces.forEach(f=>idx.push(f[0],f[1],f[2]));
    const fg=new THREE.BufferGeometry(); fg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); fg.setIndex(idx); fg.computeVertexNormals();
    g.add(new THREE.Mesh(fg,new THREE.MeshStandardMaterial({color:0x1f6feb,transparent:true,opacity:.3,side:THREE.DoubleSide})));
    const wm=new THREE.MeshStandardMaterial({color:0x9ec5ff,transparent:true,opacity:.32,side:THREE.DoubleSide});
    for(let i=0;i<corners.length;i++){const a=corners[i],b=corners[(i+1)%corners.length];
      const wg=new THREE.BufferGeometry();
      wg.setAttribute('position',new THREE.Float32BufferAttribute([a.x,0,a.y,b.x,0,b.y,b.x,h,b.y, a.x,0,a.y,b.x,h,b.y,a.x,h,a.y],3)); wg.computeVertexNormals();
      g.add(new THREE.Mesh(wg,wm));}
  }
  (objects||[]).forEach(o=>{
    const box=new THREE.Mesh(new THREE.BoxGeometry(Math.max(o.w,.05),o.h,Math.max(o.d,.05)),
      new THREE.MeshStandardMaterial({color:o.color||0xf4b13c,transparent:true,opacity:.6}));
    box.position.set(o.cx,o.h/2,o.cy); box.rotation.y=o.rot||0; g.add(box);
  });
  return g;
}

/* ===== 결과 시트 ===== */
let lastResult=null, savedOnce=false;
function showResult(corners,objects,h,source){
  lastResult={corners,objects,h,source}; savedOnce=false; $('placeRow').style.display='none';
  drawPlan($('plan'),corners,objects);
  const area=polygonArea(corners); let perim=0; for(let i=0;i<corners.length;i++)perim+=dist(corners[i],corners[(i+1)%corners.length]);
  const note=source==='ar'?'ARCore 실측(1:1). 트래킹 상태 따라 오차.':'기준물 보정 실측. 바닥이 한 평면·모든 모서리가 사진에 보일 때 정확.';
  $('summary').innerHTML=`면적 <b>${area.toFixed(2)} m²</b> · 둘레 <b>${perim.toFixed(2)} m</b> · 코너 ${corners.length} · 가구 ${objects.length} · 벽높이 ${h.toFixed(2)}m<br><span style="color:#5f7488">※ ${note}</span>`;
  // AR 소스일 때만 이어서 배치 가능
  $('goPlace').parentElement.dataset.ar = (source==='ar')?'1':'0';
  $('sheet').style.display='flex';
}
function drawPlan(svg,corners,objects){
  const size=600,pad=52;
  const all=[...corners]; (objects||[]).forEach(o=>objCorners(o).forEach(p=>all.push(p)));
  if(!all.length){ svg.innerHTML='<rect width="600" height="600" fill="#0d1720"/>'; return; }
  const xs=all.map(c=>c.x),ys=all.map(c=>c.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const sc=Math.min((size-2*pad)/Math.max(maxX-minX,.001),(size-2*pad)/Math.max(maxY-minY,.001));
  const TX=x=>pad+(x-minX)*sc,TY=y=>pad+(y-minY)*sc;
  let s=`<rect width="600" height="600" fill="#0d1720"/>`;
  if(corners.length>=2){
    s+=`<polygon points="${corners.map(c=>`${TX(c.x).toFixed(1)},${TY(c.y).toFixed(1)}`).join(' ')}" fill="#35d6c022" stroke="#35d6c0" stroke-width="2.5"/>`;
    for(let i=0;i<corners.length;i++){const a=corners[i],b=corners[(i+1)%corners.length],L=dist(a,b);
      const mx=(TX(a.x)+TX(b.x))/2,my=(TY(a.y)+TY(b.y))/2;
      s+=`<circle cx="${TX(a.x).toFixed(1)}" cy="${TY(a.y).toFixed(1)}" r="4" fill="#35d6c0"/>`;
      s+=`<text x="${mx.toFixed(1)}" y="${(my-5).toFixed(1)}" fill="#cfe3ff" font-size="13" text-anchor="middle" font-family="monospace">${L.toFixed(2)}m</text>`;}
  }
  (objects||[]).forEach(o=>{const cs=objCorners(o).map(p=>`${TX(p.x).toFixed(1)},${TY(p.y).toFixed(1)}`).join(' ');
    s+=`<polygon points="${cs}" fill="#f4b13c55" stroke="#f4b13c" stroke-width="1.5"/>`;});
  svg.innerHTML=s;
}
$('dlSvg').addEventListener('click',()=>{ afterSave(); download(new Blob([`<?xml version="1.0"?>\n`+$('plan').outerHTML],{type:'image/svg+xml'}),'floorplan.svg'); });
$('dlJson').addEventListener('click',()=>{ afterSave(); const r=lastResult;
  download(new Blob([JSON.stringify({unit:'meters',height:r.h,corners:r.corners,objects:r.objects,area:polygonArea(r.corners),source:r.source},null,2)],{type:'application/json'}),'room.json'); });
$('dlGlb').addEventListener('click',()=>{ const r=lastResult; if(!r||r.corners.length<3){setStatusAll('먼저 도면을 만들어줘.');return;}
  afterSave(); new GLTFExporter().parse(buildRoomGroup(r.corners,r.objects,r.h),res=>download(new Blob([res],{type:'model/gltf-binary'}),'room.glb'),e=>{},{binary:true}); });
function afterSave(){ // 저장을 한 번이라도 하면 배치 버튼 노출 (AR 소스일 때만)
  if(savedOnce) return; savedOnce=true;
  if($('goPlace').parentElement.dataset.ar==='1') $('placeRow').style.display='flex';
}
$('closeSheet').addEventListener('click',()=>$('sheet').style.display='none');
$('goPlace').addEventListener('click',()=>{ $('sheet').style.display='none'; enterPlaceStage(); });

/* ================= AR ================= */
let renderer,scene,camera,reticle,hitTestSource=null,reticleVisible=false,xrSession=null;
let traceGroup,planesGroup,arLive=null,arLastHit=null;
let arDistSprite=null,distCanvas=null,dctx=null,distTex=null;
const planeMap=new Map(); let showPlanes=true;
let arStage='outline';
let arCorners=[],arCornerAnchors=[],arPlaceReq=false;
let arObjects=[],arObjectAnchors=[],arObjReq=false;
let placeTool='침대', objRot=0, customA=null, previewMesh=null;
let viewMode='fp';

async function startAR(stage){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,40);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight); renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);
  renderer.domElement.style.position='fixed'; renderer.domElement.style.inset='0'; renderer.domElement.style.zIndex='15';

  scene.add(new THREE.HemisphereLight(0xffffff,0x223344,1.2));
  const dl=new THREE.DirectionalLight(0xffffff,.9); dl.position.set(1,3,2); scene.add(dl);

  reticle=new THREE.Group();
  reticle.add(new THREE.Mesh(new THREE.RingGeometry(0.075,0.095,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff})));
  const rdot=new THREE.Mesh(new THREE.CircleGeometry(0.013,24).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xff5a5a})); rdot.position.y=0.002; reticle.add(rdot);
  reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

  arLive=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xff5a5a})); arLive.frustumCulled=false; arLive.visible=false; scene.add(arLive);
  distCanvas=document.createElement('canvas'); distCanvas.width=256; distCanvas.height=72; dctx=distCanvas.getContext('2d');
  distTex=new THREE.CanvasTexture(distCanvas);
  arDistSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:distTex,depthTest:false,transparent:true}));
  arDistSprite.scale.set(0.30,0.085,1); arDistSprite.renderOrder=999; arDistSprite.visible=false; scene.add(arDistSprite);

  traceGroup=new THREE.Group(); planesGroup=new THREE.Group(); scene.add(traceGroup,planesGroup);

  try{
    xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['local-floor','hit-test'], optionalFeatures:['dom-overlay','plane-detection','anchors'], domOverlay:{root:document.body}});
  }catch(e){ setStatusAll('세션 실패: '+e.message+' (HTTPS 필요)'); return; }
  renderer.xr.setReferenceSpaceType('local-floor'); await renderer.xr.setSession(xrSession);
  const vs=await xrSession.requestReferenceSpace('viewer'); hitTestSource=await xrSession.requestHitTestSource({space:vs});
  xrSession.addEventListener('end',onAREnd);

  arCorners=[];arCornerAnchors=[];arObjects=[];arObjectAnchors=[];arPlaceReq=false;arObjReq=false;
  customA=null; objRot=0; showPlanes=true; setView('fp');
  $('arPlane').classList.add('on');
  enterScreen('ar');
  buildPalette();
  if(stage==='place') enterPlaceStage(); else enterOutlineStage();
  renderer.setAnimationLoop(onARFrame);
}
function onAREnd(){ renderer.setAnimationLoop(null); hitTestSource=null; xrSession=null;
  if(renderer?.domElement) renderer.domElement.remove(); planeMap.clear(); close3D(); backToIntro(); }

function enterOutlineStage(){ arStage='outline'; $('outlineTools').style.display=''; $('placeTools').style.display='none';
  setStatusAll('흰 원을 벽·바닥 모서리에 대고 "코너 추가". 다 돌면 "맵 생성 완료".'); rebuildAR(); }
function enterPlaceStage(){ arStage='place'; $('outlineTools').style.display='none'; $('placeTools').style.display='';
  customA=null; setStatusAll('가구를 고르고 "놓기". 커스텀 박스는 바닥 두 점을 찍어.'); rebuildAR(); }

function onARFrame(t,frame){
  if(frame && hitTestSource){
    const ref=renderer.xr.getReferenceSpace();
    const hits=frame.getHitTestResults(hitTestSource);
    if(hits.length){ const p=hits[0].getPose(ref); reticle.visible=(viewMode==='fp');
      reticle.matrix.fromArray(p.transform.matrix); reticleVisible=true;
      arLastHit={x:p.transform.position.x,y:p.transform.position.z,h:p.transform.position.y};
    } else { reticle.visible=false; reticleVisible=false; arLastHit=null; }

    // 앵커 드리프트 보정
    let moved=false;
    for(let i=0;i<arCornerAnchors.length;i++){const a=arCornerAnchors[i]; if(!a)continue; const ap=frame.getPose(a.anchorSpace,ref); if(!ap)continue;
      const nx=ap.transform.position.x,ny=ap.transform.position.z,nh=ap.transform.position.y;
      if(Math.abs(nx-arCorners[i].x)>0.001||Math.abs(ny-arCorners[i].y)>0.001){arCorners[i]={x:nx,y:ny,h:nh};moved=true;}}
    for(let i=0;i<arObjectAnchors.length;i++){const a=arObjectAnchors[i]; if(!a)continue; const ap=frame.getPose(a.anchorSpace,ref); if(!ap)continue;
      const nx=ap.transform.position.x,ny=ap.transform.position.z;
      if(Math.abs(nx-arObjects[i].cx)>0.001||Math.abs(ny-arObjects[i].cy)>0.001){arObjects[i].cx=nx;arObjects[i].cy=ny;moved=true;}}
    if(moved) rebuildAR();

    if(arPlaceReq && hits.length && arLastHit){ doPlaceCorner(hits[0]); arPlaceReq=false; }
    if(arObjReq && hits.length && arLastHit){ doPlaceObject(hits[0]); arObjReq=false; }

    updatePreview(); updateLive(); updatePlanes(frame,ref); planesGroup.visible=(showPlanes && arStage==='outline' && viewMode==='fp');
  }
  renderer.render(scene,camera);
}

/* --- 외곽선 배치 --- */
$('arAdd').addEventListener('click',()=>{ if(!reticleVisible||!arLastHit){setStatusAll('바닥이 아직 안 잡혔어.');return;} arPlaceReq=true; });
function doPlaceCorner(hit){
  const idx=arCorners.length; arCorners.push({x:arLastHit.x,y:arLastHit.y,h:arLastHit.h}); arCornerAnchors.push(null); rebuildAR();
  if(hit.createAnchor) hit.createAnchor().then(a=>{if(idx<arCornerAnchors.length)arCornerAnchors[idx]=a;}).catch(()=>{});
  if(arCorners.length>=2) setStatusAll(`코너 ${arCorners.length} · 방금 벽 ${dist(arCorners[arCorners.length-2],arCorners[arCorners.length-1]).toFixed(2)}m`);
  else setStatusAll(`코너 ${arCorners.length} · 다음 모서리로`);
}
$('arUndo').addEventListener('click',()=>{ if(arCorners.length){arCorners.pop();const a=arCornerAnchors.pop();if(a&&a.delete)a.delete();} rebuildAR(); setStatusAll('되돌림'); });
$('arClear').addEventListener('click',()=>{ arCornerAnchors.forEach(a=>{if(a&&a.delete)a.delete();}); arCorners=[];arCornerAnchors=[]; rebuildAR(); setStatusAll('외곽선 지웠어.'); });
$('arPlane').addEventListener('click',()=>{ showPlanes=!showPlanes; $('arPlane').classList.toggle('on',showPlanes); });
$('arAutoFloor').addEventListener('click',autoFillFloor);
$('arBuild').addEventListener('click',()=>{ if(arCorners.length<3){setStatusAll('코너 최소 3개.');return;}
  showResult(arCorners.map(c=>({...c})),arObjects.map(o=>({...o})),clampH($('arWallH').value),'ar'); });

/* --- 가구 배치 --- */
function buildPalette(){ const p=$('palette'); p.innerHTML='';
  Object.keys(PRESETS).forEach(k=>{ const b=document.createElement('button'); b.className='chip'+(k===placeTool?' on':''); b.textContent=k; b.dataset.k=k;
    b.addEventListener('click',()=>{ placeTool=k; customA=null; [...p.children].forEach(c=>c.classList.toggle('on',c.dataset.k===k));
      $('objHrow').style.display=PRESETS[k].custom?'':'none';
      setStatusAll(PRESETS[k].custom?'커스텀: 바닥 두 점(대각)을 찍어':`${k} 위치를 겨누고 "놓기"`); });
    p.appendChild(b); });
  $('objHrow').style.display=PRESETS[placeTool].custom?'':'none';
}
$('objRotate').addEventListener('click',()=>{ objRot=(objRot+Math.PI/4)%(Math.PI*2); });
$('objAdd').addEventListener('click',()=>{ if(!reticleVisible||!arLastHit){setStatusAll('바닥이 아직 안 잡혔어.');return;} arObjReq=true; });
function doPlaceObject(hit){
  const pr=PRESETS[placeTool];
  if(pr.custom){
    if(!customA){ customA={x:arLastHit.x,y:arLastHit.y}; setStatusAll('반대편 모서리를 찍어'); return; }
    const b={x:arLastHit.x,y:arLastHit.y}; const o={type:'커스텀',cx:(customA.x+b.x)/2,cy:(customA.y+b.y)/2,
      w:Math.max(Math.abs(b.x-customA.x),.05),d:Math.max(Math.abs(b.y-customA.y),.05),h:clampH2($('objH').value),rot:0,color:pr.c};
    pushObject(o,hit); customA=null;
  }else{
    const o={type:placeTool,cx:arLastHit.x,cy:arLastHit.y,w:pr.w,d:pr.d,h:pr.h,rot:objRot,color:pr.c};
    pushObject(o,hit);
  }
}
function pushObject(o,hit){ const idx=arObjects.length; arObjects.push(o); arObjectAnchors.push(null); rebuildAR();
  if(hit.createAnchor) hit.createAnchor().then(a=>{if(idx<arObjectAnchors.length)arObjectAnchors[idx]=a;}).catch(()=>{});
  setStatusAll(`가구 ${arObjects.length}개 배치됨`); }
$('objUndo').addEventListener('click',()=>{ if(customA){customA=null;setStatusAll('취소');return;}
  if(arObjects.length){arObjects.pop();const a=arObjectAnchors.pop();if(a&&a.delete)a.delete();} rebuildAR(); setStatusAll('되돌림'); });
$('objClear').addEventListener('click',()=>{ arObjectAnchors.forEach(a=>{if(a&&a.delete)a.delete();}); arObjects=[];arObjectAnchors=[];customA=null; rebuildAR(); setStatusAll('가구 비웠어.'); });
$('objDone').addEventListener('click',()=>{ showResult(arCorners.map(c=>({...c})),arObjects.map(o=>({...o})),clampH($('arWallH').value),'ar'); });

/* --- 씬 재구성 --- */
function rebuildAR(){
  traceGroup.traverse(o=>{if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose();}); traceGroup.clear();
  // 코너 점
  arCorners.forEach(c=>{const s=new THREE.Mesh(new THREE.SphereGeometry(.03,16,16),new THREE.MeshBasicMaterial({color:0x35d6c0})); s.position.set(c.x,c.h??.02,c.y); traceGroup.add(s);});
  // 외곽선 + 바닥 면 색칠
  if(arCorners.length>=2){
    const pts=arCorners.map(c=>new THREE.Vector3(c.x,c.h??.02,c.y)); if(arCorners.length>=3)pts.push(pts[0].clone());
    traceGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x35d6c0})));
  }
  if(arCorners.length>=3){
    const contour=arCorners.map(c=>new THREE.Vector2(c.x,c.y)); const faces=THREE.ShapeUtils.triangulateShape(contour,[]);
    const pos=[],idx=[]; arCorners.forEach(c=>pos.push(c.x,0.01,c.y)); faces.forEach(f=>idx.push(f[0],f[1],f[2]));
    const fg=new THREE.BufferGeometry(); fg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); fg.setIndex(idx); fg.computeVertexNormals();
    traceGroup.add(new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:0x35d6c0,transparent:true,opacity:.18,side:THREE.DoubleSide})));
  }
  // 배치된 가구
  arObjects.forEach(o=>{ const box=new THREE.Mesh(new THREE.BoxGeometry(o.w,o.h,o.d),
      new THREE.MeshBasicMaterial({color:o.color||0xf4b13c,transparent:true,opacity:.45}));
    box.position.set(o.cx,o.h/2,o.cy); box.rotation.y=o.rot||0; traceGroup.add(box);
    box.add(new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),new THREE.LineBasicMaterial({color:o.color||0xf4b13c})));
  });
}
function updatePreview(){
  if(previewMesh){ scene.remove(previewMesh); previewMesh.geometry.dispose(); previewMesh.material.dispose(); previewMesh=null; }
  if(arStage!=='place'||viewMode!=='fp'||!reticleVisible||!arLastHit) return;
  const pr=PRESETS[placeTool]; if(pr.custom) return; // 커스텀은 선/사각 프리뷰(아래 updateLive)
  previewMesh=new THREE.Mesh(new THREE.BoxGeometry(pr.w,pr.h,pr.d),new THREE.MeshBasicMaterial({color:pr.c,transparent:true,opacity:.35}));
  previewMesh.position.set(arLastHit.x,pr.h/2,arLastHit.y); previewMesh.rotation.y=objRot; scene.add(previewMesh);
}
function updateLive(){
  // 외곽선: 직전 코너→조준점 / 커스텀: 첫 점→조준점
  let anchor=null;
  if(arStage==='outline'&&arCorners.length>=1) anchor=arCorners[arCorners.length-1];
  else if(arStage==='place'&&PRESETS[placeTool].custom&&customA) anchor=customA;
  if(anchor && reticleVisible && arLastHit && viewMode==='fp'){
    const a=new THREE.Vector3(anchor.x,anchor.h??.02,anchor.y), b=new THREE.Vector3(arLastHit.x,arLastHit.h??.02,arLastHit.y);
    arLive.geometry.setFromPoints([a,b]); arLive.visible=true;
    const d=Math.hypot(a.x-b.x,a.z-b.z); drawDist(d<1?`${Math.round(d*100)} cm`:`${d.toFixed(2)} m`);
    arDistSprite.position.set((a.x+b.x)/2,Math.max(a.y,b.y)+0.1,(a.z+b.z)/2); arDistSprite.visible=true;
  } else { arLive.visible=false; if(arDistSprite)arDistSprite.visible=false; }
}
function drawDist(txt){ if(!dctx)return; const w=256,h=72,r=34; dctx.clearRect(0,0,w,h); dctx.fillStyle='rgba(255,90,90,0.95)';
  dctx.beginPath(); dctx.moveTo(r,4); dctx.arcTo(w-2,4,w-2,h-4,r); dctx.arcTo(w-2,h-4,2,h-4,r); dctx.arcTo(2,h-4,2,4,r); dctx.arcTo(2,4,w-2,4,r); dctx.closePath(); dctx.fill();
  dctx.fillStyle='#fff'; dctx.font='bold 38px sans-serif'; dctx.textAlign='center'; dctx.textBaseline='middle'; dctx.fillText(txt,w/2,h/2+2); distTex.needsUpdate=true; }

function updatePlanes(frame,ref){ const det=frame.detectedPlanes; if(!det)return;
  for(const [pl,rec] of planeMap){ if(!det.has(pl)){planesGroup.remove(rec.mesh); rec.mesh.geometry.dispose(); planeMap.delete(pl);} }
  for(const pl of det){ const rec=planeMap.get(pl); if(rec&&rec.time===pl.lastChangedTime)continue;
    const pose=frame.getPose(pl.planeSpace,ref); if(!pose||!pl.polygon?.length)continue;
    const m=new THREE.Matrix4().fromArray(pose.transform.matrix); const pts=pl.polygon.map(p=>new THREE.Vector3(p.x,p.y,p.z).applyMatrix4(m));
    let ay=0; pts.forEach(v=>ay+=v.y); ay/=pts.length; const col=pl.orientation==='vertical'?0x3f5a78:(ay<0.6?0x385a52:0x445260);
    if(rec){planesGroup.remove(rec.mesh); rec.mesh.geometry.dispose();}
    const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col}));
    line.userData={orientation:pl.orientation,avgY:ay,worldPts:pts}; planesGroup.add(line); planeMap.set(pl,{mesh:line,time:pl.lastChangedTime}); }
}
function autoFillFloor(){ let best=null,bestA=0;
  for(const rec of planeMap.values()){const u=rec.mesh.userData; if(u.orientation!=='horizontal'||u.avgY>0.6)continue;
    const a=polygonArea(u.worldPts.map(v=>({x:v.x,y:v.z}))); if(a>bestA){bestA=a;best=u;}}
  if(!best){setStatusAll('감지된 바닥 평면이 없어. 더 비춰줘.');return;}
  arCornerAnchors.forEach(a=>{if(a&&a.delete)a.delete();}); arCornerAnchors=[];
  arCorners=best.worldPts.map(v=>({x:v.x,y:v.z,h:0})); arCornerAnchors=arCorners.map(()=>null); rebuildAR();
  setStatusAll(`바닥 자동 채움 · 코너 ${arCorners.length} (되돌리기로 다듬어)`);
}
function clampH(v){return Math.min(Math.max(parseFloat(v)||2.4,1),6);}
function clampH2(v){return Math.min(Math.max(parseFloat(v)||0.5,0.05),3);}

$('viewSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
function setView(v){ viewMode=v;
  $('viewSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('view2d').style.display=v==='2d'?'block':'none';
  if(v==='2d') drawPlan($('view2d').querySelector('svg'),arCorners,arObjects);
  if(v==='3d') open3D(); else close3D();
  // 1인칭이 아니면 하단 HUD 숨김(측정 방해 X)
  $('hud').style.display=(v==='fp')?'flex':'none';
}
let orbitR,orbitScene,orbitCam,orbitCtrl,orbitReq=0;
function open3D(){ const host=$('view3d'); host.style.display='block';
  if(!orbitR){ try{
      orbitR=new THREE.WebGLRenderer({antialias:true}); orbitR.setPixelRatio(devicePixelRatio); host.appendChild(orbitR.domElement);
      orbitScene=new THREE.Scene(); orbitScene.background=new THREE.Color(0x0b1119);
      orbitScene.add(new THREE.HemisphereLight(0xffffff,0x223344,1.2));
      const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(3,5,2); orbitScene.add(dl);
      const grid=new THREE.GridHelper(20,20,0x1c2a38,0x14202c); orbitScene.add(grid);
      orbitCam=new THREE.PerspectiveCamera(55,1,0.01,100); orbitCtrl=new OrbitControls(orbitCam,orbitR.domElement);
    }catch(e){ host.innerHTML='<div style="color:#8298ab;padding:40px;text-align:center;font-size:14px">이 기기에서 3D 뷰를 열 수 없어. 1인칭/2D를 써줘.</div>'; return; } }
  const w=host.clientWidth,h=host.clientHeight; orbitR.setSize(w,h); orbitCam.aspect=w/h; orbitCam.updateProjectionMatrix();
  orbitScene.children.filter(c=>c.userData.room).forEach(c=>orbitScene.remove(c));
  const g=buildRoomGroup(arCorners,arObjects,clampH($('arWallH').value)); g.userData.room=true; orbitScene.add(g);
  // 카메라 프레이밍
  const xs=arCorners.map(c=>c.x),ys=arCorners.map(c=>c.y);
  const cx=xs.length?(Math.min(...xs)+Math.max(...xs))/2:0, cy=ys.length?(Math.min(...ys)+Math.max(...ys))/2:0;
  const span=xs.length?Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),1):3;
  orbitCtrl.target.set(cx,0.5,cy); orbitCam.position.set(cx+span,span*1.1,cy+span); orbitCtrl.update();
  cancelAnimationFrame(orbitReq);
  const loop=()=>{ orbitCtrl.update(); orbitR.render(orbitScene,orbitCam); orbitReq=requestAnimationFrame(loop); }; loop();
}
function close3D(){ $('view3d').style.display='none'; cancelAnimationFrame(orbitReq); orbitReq=0; }

    requestAnimationFrame(()=>requestAnimationFrame(()=>{sizeCanvas();drawPhoto();})); updateSteps(); $('phStatus').textContent='기준물 네 모서리를 좌상→우상→우하→좌하 순서로 탭';
  }catch(err){ $('phStatus').textContent='사진을 불러오지 못했어 ('+(err?.message||err)+'). 다른 사진/사파리로 시도.'; } });
async function loadImageFile(f){ if('createImageBitmap' in window){ try{return await createImageBitmap(f,{imageOrientation:'from-image'});}catch(_){try{return await createImageBitmap(f);}catch(__){}} }
  const d=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read fail'));r.readAsDataURL(f);});
  return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode fail'));i.src=d;}); }
function sizeCanvas(){ const dpr=devicePixelRatio||1; const w=cv.clientWidth||innerWidth,h=cv.clientHeight||Math.round(innerHeight*0.6);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  if(img){const s=Math.min(w/img.width,h/img.height);fit={scale:s,ox:(w-img.width*s)/2,oy:(h-img.height*s)/2};} }
addEventListener('resize',()=>{ if($('photoScreen').style.display==='flex'){sizeCanvas();drawPhoto();} });
function toImg(cx2,cy2){return {x:(cx2-fit.ox)/fit.scale,y:(cy2-fit.oy)/fit.scale};}
function toDisp(ix,iy){return {x:fit.ox+ix*fit.scale,y:fit.oy+iy*fit.scale};}
cv.addEventListener('pointerdown',ev=>{ if(!img)return; const r=cv.getBoundingClientRect(); const p=toImg(ev.clientX-r.left,ev.clientY-r.top);
  if(p.x<0||p.y<0||p.x>img.width||p.y>img.height)return;
  if(phStage==='calib'){ if(calibPts.length<4){calibPts.push(p); if(calibPts.length===4)computeH(); else $('phStatus').textContent=`기준물 모서리 ${calibPts.length}/4`;} }
  else if(phStage==='trace'||phStage==='ready'){ tracePts.push(p); recomputeCorners();
    $('phStatus').textContent=phCorners.length>=2?`방 코너 ${phCorners.length} · 방금 벽 ${dist(phCorners[phCorners.length-2],phCorners[phCorners.length-1]).toFixed(2)}m`:`방 코너 ${phCorners.length} · 계속 탭`;
    $('phBuild').disabled=phCorners.length<3; }
  drawPhoto(); });
function refDims(){ const v=$('refPreset').value; if(v==='custom'){return {w:(parseFloat($('refW').value)||21)/100,h:(parseFloat($('refH').value)||29.7)/100};} const [w,h]=v.split(',').map(Number); return {w,h}; }
function computeH(){ const {w,h}=refDims(); const src=calibPts.map(p=>[p.x,p.y]); const dst=[[0,0],[w,0],[w,h],[0,h]]; H=solveHomography(src,dst); phStage='trace'; updateSteps(); $('phStatus').textContent='보정 완료 ✓ 방 바닥 모서리를 순서대로 탭'; }
function recomputeCorners(){ phCorners=tracePts.map(p=>applyH(H,p.x,p.y)); }
$('phUndo').addEventListener('click',()=>{ if(phStage==='calib'&&calibPts.length)calibPts.pop(); else if(tracePts.length){tracePts.pop();recomputeCorners();$('phBuild').disabled=phCorners.length<3;} drawPhoto(); });
$('phReset').addEventListener('click',resetPhoto);
$('phBuild').addEventListener('click',()=>{ if(phCorners.length<3)return; showResult(phCorners.map(c=>({...c})),[],clampH($('phWallH').value),'photo'); });
function updateSteps(){ const calibOn=phStage==='calib';
  $('dot1').className='stepdot calib'+((calibOn||phStage==='trace'||phStage==='ready')?' on':'');
  $('dot2').className='stepdot'+((phStage==='trace'||phStage==='ready')?' on':'');
  $('stepText').textContent=calibOn?'1. 기준물 보정':(phStage==='need-image'?'사진 필요':'2. 방 모서리');
  $('calibRow').style.opacity=phStage==='need-image'||calibOn?'1':'.4'; }
function drawPhoto(){ const w=cv.clientWidth,h=cv.clientHeight; ctx.clearRect(0,0,w,h); ctx.fillStyle='#0a1119'; ctx.fillRect(0,0,w,h);
  if(!img){ctx.fillStyle='#5f7488';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('사진을 불러오면 여기에 표시돼',w/2,h/2);return;}
  ctx.drawImage(img,fit.ox,fit.oy,img.width*fit.scale,img.height*fit.scale);
  if(calibPts.length){ ctx.strokeStyle='#f4b13c';ctx.fillStyle='#f4b13c';ctx.lineWidth=2;ctx.beginPath();
    calibPts.forEach((p,i)=>{const d=toDisp(p.x,p.y);i?ctx.lineTo(d.x,d.y):ctx.moveTo(d.x,d.y);}); if(calibPts.length===4)ctx.closePath(); ctx.stroke();
    calibPts.forEach((p,i)=>{const d=toDisp(p.x,p.y);ctx.beginPath();ctx.arc(d.x,d.y,5,0,7);ctx.fill();ctx.fillStyle='#04211d';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(i+1,d.x,d.y+4);ctx.fillStyle='#f4b13c';}); }
  if(tracePts.length){ ctx.strokeStyle='#35d6c0';ctx.fillStyle='#35d6c0';ctx.lineWidth=2.5;ctx.beginPath();
    tracePts.forEach((p,i)=>{const d=toDisp(p.x,p.y);i?ctx.lineTo(d.x,d.y):ctx.moveTo(d.x,d.y);}); if(tracePts.length>=3)ctx.closePath(); ctx.stroke();
    for(let i=0;i<tracePts.length;i++){const d=toDisp(tracePts[i].x,tracePts[i].y);ctx.beginPath();ctx.arc(d.x,d.y,4,0,7);ctx.fill();
      if(H&&phCorners.length>=2&&(i<phCorners.length-1||phCorners.length>=3)){const a=phCorners[i],b=phCorners[(i+1)%phCorners.length];const nb=toDisp(tracePts[(i+1)%tracePts.length].x,tracePts[(i+1)%tracePts.length].y);
        ctx.fillStyle='#cfe3ff';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText(dist(a,b).toFixed(2)+'m',(d.x+nb.x)/2,(d.y+nb.y)/2-6);ctx.fillStyle='#35d6c0';}} }
}
function solveHomography(src,dst){ const A=[],b=[]; for(let i=0;i<4;i++){const [x,y]=src[i],[X,Y]=dst[i];
  A.push([x,y,1,0,0,0,-X*x,-X*y]);b.push(X); A.push([0,0,0,x,y,1,-Y*x,-Y*y]);b.push(Y);} const h=gauss(A,b);
  return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]]; }
function gauss(A,b){ const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r; [M[c],M[p]]=[M[p],M[c]];
    const pv=M[c][c]; if(Math.abs(pv)<1e-12)continue; for(let j=c;j<=n;j++)M[c][j]/=pv;
    for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c];for(let j=c;j<=n;j++)M[r][j]-=f*M[c][j];}} return M.map(r=>r[n]); }
function applyH(H,x,y){ const X=H[0][0]*x+H[0][1]*y+H[0][2],Y=H[1][0]*x+H[1][1]*y+H[1][2],W=H[2][0]*x+H[2][1]*y+H[2][2]; return {x:X/W,y:Y/W}; }

/* 숫자 입력: 탭하면 전체 선택 → 덮어쓰기 */
document.querySelectorAll('input[type=number]').forEach(i=>{
  const sel=()=>{try{i.select();}catch(_){}}; i.addEventListener('focus',sel); i.addEventListener('click',sel);
});
</script>
